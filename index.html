
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos - Guilherme</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Cadastro de Alunos</h1>

        <p>Adicione novos alunos à lista</p>

        <form id="formulario">
            <input
                type="text"
                id="nome"
                placeholder="Digite o nome do aluno"
                required
            >

            <button type="submit">
                Adicionar Aluno
            </button>
        </form>

        <h2>Alunos cadastrados</h2>

        <ul id="lista"></ul>

        <footer>
            Desenvolvido por Guilherme Camacho da Luz
        </footer>
    </div>

    <script src="main.js"></script>

</body>
</html>
